name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        # tsc -b también compila los *.test.ts: necesita vitest, que vive en frontend/.
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Typecheck (tsc)
        run: npx tsc -b frontend/tsconfig.json
      # ESLint queda fuera hasta limpiar los 38 errores que ya existían en main.
