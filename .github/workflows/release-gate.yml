name: release-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coach_ai
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coach -d coach_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach_ai
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Backend migrations
        run: alembic upgrade head

      - name: Backend critical tests
        run: |
          python -m pytest -q tests/test_health.py tests/test_auth_flow.py tests/test_sessions_planning_access.py

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build

      - name: Start API and check health/ready
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir src &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8000/ready > /tmp/ready.json
          cat /tmp/ready.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/ready.json').read_text(encoding='utf-8'))
          assert payload.get('ready') is True, f"/ready gate failed: {payload}"
          PY
