services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: coach_ai
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      - "5432:5432"
    volumes:
      - D:/DockerAppData/coach-ai/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://coach:coach@db:5432/coach_ai
      JWT_SECRET: dev-insecure-change-me
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://api:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_ENABLE_GUEST_LOGIN: ${VITE_ENABLE_GUEST_LOGIN:-true}
      VITE_ENABLE_OFFLINE_VOICE_CAPTURE: ${VITE_ENABLE_OFFLINE_VOICE_CAPTURE:-true}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - D:/DockerAppData/coach-ai/frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

