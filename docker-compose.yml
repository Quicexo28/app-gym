services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: coach_ai
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      - "5432:5432"
    volumes:
      - coach_ai_pg:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://coach:coach@db:5432/coach_ai
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"

volumes:
  coach_ai_pg:
