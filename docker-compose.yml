services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: coach_ai
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      - "5432:5432"
    volumes:
      - coach_ai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://coach:coach@db:5432/coach_ai
      JWT_SECRET: dev-insecure-change-me
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  coach_ai_pg:
